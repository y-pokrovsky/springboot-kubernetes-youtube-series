
services:
  bookmarker-api:
    image: ypokrovsky/bookmarker-api:latest
    build:
      context: bookmarker-api
      dockerfile: Dockerfile.layered
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "18080:8080"
    restart: always

  bookmarker-ui-nextjs:
    image: ypokrovsky/bookmarker-ui-nextjs:latest
    container_name: bookmarker-ui-nextjs
    build:
      context: bookmarker-ui-nextjs
      dockerfile: Dockerfile
    ports:
      - "13000:3000"
    environment:
      API_BASE_URL: http://bookmarker-api:8080
      NEXT_PUBLIC_API_BASE_URL: http://localhost:18080